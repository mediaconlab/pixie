name: One-time cleanup (delete staging Worker)

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-staging.yml"]

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Run from an empty folder: no wrangler config here, so only the named staging Worker can be affected.
      - name: Delete pixie-orchestrator-staging
        run: |
          mkdir -p "$RUNNER_TEMP/empty" && cd "$RUNNER_TEMP/empty"
          npx -y wrangler@4 delete pixie-orchestrator-staging --force
