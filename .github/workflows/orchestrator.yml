name: Orchestrator (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["brain/**", "PROTOCOL.md", ".github/workflows/orchestrator.yml"]
  pull_request:
    paths: ["brain/**"]
  workflow_dispatch:

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brain/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: brain
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: brain/package-lock.json
      - run: npm ci
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repo Settings → Secrets → Actions"; exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pixie-orchestrator --remote
      - name: Deploy Worker
        run: npx wrangler deploy | tee deploy.log
      - name: Smoke test
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Orchestrator URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do curl -fsS "$URL/health" && exit 0; sleep 5; done; exit 1
