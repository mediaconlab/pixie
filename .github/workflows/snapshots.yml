name: Character snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mac/Sources/Pixie/Avatar/**", "mac/Sources/Pixie/App/SnapshotRenderer.swift", ".github/workflows/snapshots.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --arch arm64 --package-path mac
      - name: Render the character
        run: |
          BIN=$(swift build -c release --arch arm64 --package-path mac --show-bin-path)/Pixie
          "$BIN" --render-snapshots "$RUNNER_TEMP/shots"
          ls "$RUNNER_TEMP/shots" | wc -l
      - name: Publish to the snapshots branch
        run: |
          cd "$RUNNER_TEMP/shots"
          git init -q -b snapshots
          git config user.name "pixie-ci"
          git config user.email "pixie-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Character snapshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" snapshots
