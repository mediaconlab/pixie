name: Apps (Mac, Android, VS Code)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["brain/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (errors surfaced as annotations)
        run: |
          set -o pipefail
          swift build -c release --arch arm64 --package-path mac 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r l; do
              f=$(echo "$l" | sed -E 's#^.*/(mac/[^:]+):([0-9]+):.*#\1#'); n=$(echo "$l" | sed -E 's#^.*/mac/[^:]+:([0-9]+):.*#\1#')
              echo "::error file=$f,line=$n::$(echo "$l" | sed -E 's#^.*error: ##')"
            done; exit 1; }
      - name: Unit tests (PixieCore)
        run: |
          set -o pipefail
          swift test --package-path mac 2>&1 | tee test.log || {
            grep -E "error:|failed" test.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Build and package Pixie.app (arm64)
        run: bash mac/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Pixie-macOS-arm64
          path: mac/dist/Pixie-macOS-arm64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pixie-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pixie-android
          path: Pixie-android.apk

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Pixie-vscode
          path: vscode/pixie-vscode.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, android, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Pixie-macOS-arm64.zip
            out/Pixie-android.apk
            out/pixie-vscode.vsix
